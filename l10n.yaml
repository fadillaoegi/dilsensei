# Konfigurasi generator lokalisasi Flutter.
#
# Bahasa template adalah Inggris karena itu bahasa default aplikasi.
# Regenerate berjalan otomatis saat build; manual: flutter gen-l10n
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppL10n
nullable-getter: false
